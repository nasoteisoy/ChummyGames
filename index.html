<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Quest - Treasure Hunt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        #gameCanvas {
            border: 3px solid #0f3460;
            background: #0a0a0a;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            max-width: 90vw;
            max-height: 90vh;
        }

        #miniMap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            border: 3px solid #0f3460;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            min-width: 200px;
        }

        #ui h3 {
            color: #e94560;
            margin-bottom: 10px;
        }

        #ui div {
            margin: 5px 0;
            font-size: 14px;
        }

        #joystickContainer {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }

        #joystick {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid #0f3460;
            border-radius: 50%;
            position: relative;
        }

        #joystickKnob {
            width: 60px;
            height: 60px;
            background: #e94560;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: background 0.1s;
        }

        #colorPicker {
            position: absolute;
            bottom: 50px;
            right: 30px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .colorBtn {
            width: 50px;
            height: 50px;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .colorBtn:active {
            transform: scale(0.9);
        }

        .colorBtn.selected {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        #startScreen, #namePrompt, #gameOverScreen, #victoryScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #namePrompt {
            display: none;
        }

        #gameOverScreen, #victoryScreen {
            display: none;
        }

        h1 {
            font-size: 48px;
            color: #e94560;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        input {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #0f3460;
            border-radius: 5px;
            margin: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            min-width: 250px;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #c23a4f;
        }

        button:active {
            transform: scale(0.95);
        }

        #roomCodeDisplay {
            font-size: 24px;
            margin: 20px;
            padding: 15px 30px;
            background: rgba(15, 52, 96, 0.5);
            border-radius: 10px;
            border: 2px solid #0f3460;
        }

        .info-text {
            font-size: 16px;
            margin: 10px;
            color: #bbb;
            max-width: 500px;
            text-align: center;
        }

        #nameChangeBtn {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 768px) {
            #miniMap {
                width: 150px;
                height: 150px;
                top: 10px;
                right: 10px;
            }

            #ui {
                font-size: 12px;
                padding: 10px;
                top: 10px;
                left: 10px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

            <input type="text" id="roomCodeInput" placeholder="Enter Room Code" maxlength="6">
            <button id="joinBtn">Join Game</button>
            <button id="createBtn">Create New Room</button>

            <button id="restartBtn">Restart Level</button>

            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            return Array.from({ length }, () =>

        let currentLevel = 0;
        let currentMap = [];
        let enemies = [];
        let treasures = [];
        let collectedTreasure = 0;
        const startPos = { x: 1, y: 1 };

        // Initialize game
        function initLevel(levelIndex) {
            const level = levels[levelIndex];
            currentMap = level.map;
            collectedTreasure = 0;
            
            // Initialize enemies
            enemies = level.enemies.map((e, i) => ({
                id: i,
                type: e.type,
                x: e.x * TILE_SIZE,
                y: e.y * TILE_SIZE,
                path: e.path ? e.path.map(p => ({x: p[0] * TILE_SIZE, y: p[1] * TILE_SIZE})) : [],
                pathIndex: 0,
                angle: 0,
                speed: e.type === 'chaser' ? 1.5 : e.type === 'patrol' ? 1 : e.type === 'spinner' ? 1 : 0.8,
                randomTimer: 0,
                teleportTimer: 0
            }));

            // Initialize treasures
            treasures = level.treasures.map((t, i) => ({
                id: i,
                x: t[0] * TILE_SIZE + TILE_SIZE/2,
                y: t[1] * TILE_SIZE + TILE_SIZE/2,
                collected: false
            }));

            document.getElementById('levelNum').textContent = levelIndex + 1;
            document.getElementById('treasureNeeded').textContent = level.treasureNeeded;
            document.getElementById('treasureCount').textContent = 0;
        }

        // UI Event Listeners
        document.getElementById('createBtn').addEventListener('click', async () => {
            roomCode = generateCode(6);
            await set(ref(database, `colorquest/${roomCode}`), {
                created: Date.now(),
                level: 0,
                gameStarted: false,
                collectedTreasure: 0,
                treasures: {},
                enemies: {}
            });
            
            document.getElementById('roomCode').textContent = roomCode;
            document.getElementById('roomCodeDisplay').style.display = 'block';
            joinRoom();
        });

        document.getElementById('joinBtn').addEventListener('click', () => {
            const code = document.getElementById('roomCodeInput').value.toUpperCase();
            if (code.length === 6) {
                roomCode = code;
                joinRoom();
            }
        });

        document.getElementById('nameSubmitBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim();
            if (name) {
                myName = name;
                updatePlayerData();
            }
            document.getElementById('namePrompt').style.display = 'none';
            document.getElementById('joystickContainer').style.display = 'block';
            document.getElementById('colorPicker').style.display = 'flex';
            document.getElementById('nameChangeBtn').style.display = 'block';
        });

        document.getElementById('nameChangeBtn').addEventListener('click', () => {
            document.getElementById('namePrompt').style.display = 'flex';
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            if (roomCode) {
                update(ref(database, `colorquest/${roomCode}`), {
                    collectedTreasure: 0,
                    treasures: {},
                    gameStarted: true
                });
                
                // Reset all players
                Object.keys(playerData).forEach(pid => {
                    update(ref(database, `colorquest/${roomCode}/players/${pid}`), {
                        x: startPos.x * TILE_SIZE,
                        y: startPos.y * TILE_SIZE,
                        dead: false
                    });

                document.getElementById('gameOverScreen').style.display = 'none';
            }
        });

        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            if (roomCode && currentLevel < levels.length - 1) {
                update(ref(database, `colorquest/${roomCode}`), {
                    level: currentLevel + 1,
                    collectedTreasure: 0,
                    treasures: {},
                    gameStarted: true
                });
                
                // Reset all players
                Object.keys(playerData).forEach(pid => {
                    update(ref(database, `colorquest/${roomCode}/players/${pid}`), {
                        x: startPos.x * TILE_SIZE,
                        y: startPos.y * TILE_SIZE,
                        dead: false
                    });
                });
                
                document.getElementById('victoryScreen').style.display = 'none';
            }
        });

        document.getElementById('menuBtn').addEventListener('click', () => location.reload());
        document.getElementById('menuBtn2').addEventListener('click', () => location.reload());

        // Color picker
        document.querySelectorAll('.colorBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                const newColor = btn.dataset.color;
                
                // Check if color is taken
                const colorTaken = Object.values(playerData).some(p => 
                    p.color === newColor && p.id !== pcID
                );
                
                if (!colorTaken) {
                    myColor = newColor;
                    document.querySelectorAll('.colorBtn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    updatePlayerData();
                }
            });
        });

        // Joystick controls
        const joystick = document.getElementById('joystick');
        const joystickKnob = document.getElementById('joystickKnob');

        function handleJoystickStart(e) {
            e.preventDefault();
            joystickActive = true;
            updateJoystick(e);
        }

        function handleJoystickMove(e) {
            if (!joystickActive) return;
            e.preventDefault();
            updateJoystick(e);
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            joystickActive = false;
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            joystickAngle = 0;
            joystickPower = 0;
        }

        function updateJoystick(e) {
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const touch = e.touches ? e.touches[0] : e;
            const deltaX = touch.clientX - centerX;
            const deltaY = touch.clientY - centerY;
            
            const distance = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), 45);
            joystickAngle = Math.atan2(deltaY, deltaX);
            joystickPower = distance / 45;
            
            const knobX = Math.cos(joystickAngle) * distance;
            const knobY = Math.sin(joystickAngle) * distance;
            
            joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
        }

        joystick.addEventListener('mousedown', handleJoystickStart);
        joystick.addEventListener('touchstart', handleJoystickStart);
        document.addEventListener('mousemove', handleJoystickMove);
        document.addEventListener('touchmove', handleJoystickMove, { passive: false });
        document.addEventListener('mouseup', handleJoystickEnd);
        document.addEventListener('touchend', handleJoystickEnd);

        // Join room and setup Firebase listeners
        async function joinRoom() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('namePrompt').style.display = 'flex';
            
            // Setup player in database
            const playerRef = ref(database, `colorquest/${roomCode}/players/${pcID}`);
            await set(playerRef, {
                id: pcID,
                name: myName,
                color: myColor,
                x: startPos.x * TILE_SIZE,
                y: startPos.y * TILE_SIZE,
                dead: false,
                lastUpdate: Date.now()
            });

            // Setup disconnect handler
            onDisconnect(playerRef).remove();

            // Listen to all players
            onValue(ref(database, `colorquest/${roomCode}/players`), (snapshot) => {
                playerData = snapshot.val() || {};
                updateUI();
            });

            // Listen to game state
            onValue(ref(database, `colorquest/${roomCode}`), (snapshot) => {
                gameState = snapshot.val() || {};
                
                if (gameState.level !== currentLevel) {
                    currentLevel = gameState.level || 0;
                    initLevel(currentLevel);
                }
                
                // Update treasures
                if (gameState.treasures) {
                    treasures.forEach(t => {
                        t.collected = gameState.treasures[t.id] || false;
                    });
                }
                
                collectedTreasure = gameState.collectedTreasure || 0;
                document.getElementById('treasureCount').textContent = collectedTreasure;
                
                // Check victory condition
                if (collectedTreasure >= levels[currentLevel].treasureNeeded) {
                    const allAtStart = Object.values(playerData).every(p => {
                        const tileX = Math.floor(p.x / TILE_SIZE);
                        const tileY = Math.floor(p.y / TILE_SIZE);
                        return tileX === startPos.x && tileY === startPos.y;
                    });
                    
                    if (allAtStart && !document.getElementById('victoryScreen').style.display) {
                        if (currentLevel === levels.length - 1) {
                            document.getElementById('victoryText').textContent = 'You completed all levels!';
                            document.getElementById('nextLevelBtn').style.display = 'none';
                        } else {
                            document.getElementById('victoryText').textContent = `Level ${currentLevel + 1} Complete!`;
                            document.getElementById('nextLevelBtn').style.display = 'block';
                        }
                        document.getElementById('victoryScreen').style.display = 'flex';
                    }
                }
                
                // Check game over condition
                const allDead = Object.values(playerData).length > 0 && 
                    Object.values(playerData).every(p => p.dead);
                if (allDead) {
                    document.getElementById('gameOverScreen').style.display = 'flex';
                }
            });

            initLevel(0);
            gameLoop();
        }

        function updatePlayerData() {
            if (!roomCode) return;
            
            const player = playerData[pcID] || {};
            let newX = player.x || startPos.x * TILE_SIZE;
            let newY = player.y || startPos.y * TILE_SIZE;
            
            if (joystickActive && !player.dead) {
                const speed = 3;
                const dx = Math.cos(joystickAngle) * joystickPower * speed;
                const dy = Math.sin(joystickAngle) * joystickPower * speed;
                
                const testX = newX + dx;
                const testY = newY + dy;
                
                if (!checkCollision(testX, newY)) {
                    newX = testX;
                }
                if (!checkCollision(newX, testY)) {
                    newY = testY;
                }
            }
            
            update(ref(database, `colorquest/${roomCode}/players/${pcID}`), {
                name: myName,
                color: myColor,
                x: newX,
                y: newY,
                lastUpdate: Date.now()
            });
        }

        function checkCollision(x, y) {
            const tileX = Math.floor(x / TILE_SIZE);
            const tileY = Math.floor(y / TILE_SIZE);
            
            const corners = [
                [x - PLAYER_SIZE/2, y - PLAYER_SIZE/2],
                [x + PLAYER_SIZE/2, y - PLAYER_SIZE/2],
                [x - PLAYER_SIZE/2, y + PLAYER_SIZE/2],
                [x + PLAYER_SIZE/2, y + PLAYER_SIZE/2]
            ];
            
            for (let corner of corners) {
                const cx = Math.floor(corner[0] / TILE_SIZE);
                const cy = Math.floor(corner[1] / TILE_SIZE);
                
                if (cy >= 0 && cy < currentMap.length && cx >= 0 && cx < currentMap[0].length) {
                    if (currentMap[cy][cx] === 1) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        function updateUI() {
            const alivePlayers = Object.values(playerData).filter(p => !p.dead).length;
            document.getElementById('playersAlive').textContent = alivePlayers;
            
            const playersList = document.getElementById('playersList');
            playersList.innerHTML = '<div style="margin-top: 10px; border-top: 1px solid #0f3460; padding-top: 5px;"></div>';
            Object.values(playerData).forEach(p => {
                const div = document.createElement('div');
                div.style.color = p.color;
                div.textContent = `${p.name} ${p.dead ? '💀' : ''}`;
                playersList.appendChild(div);
            });
        }

        // Game loop
        function gameLoop() {
            updatePlayerData();
            updateEnemies();
            checkTreasures();
            checkRevives();
            render();
            requestAnimationFrame(gameLoop);
        }

        function updateEnemies() {
            enemies.forEach(enemy => {
                switch(enemy.type) {
                    case 'chaser':
                        // Chase nearest alive player
                        let nearest = null;
                        let nearestDist = Infinity;
                        Object.values(playerData).forEach(p => {
                            if (!p.dead) {
                                const dist = Math.hypot(p.x - enemy.x, p.y - enemy.y);
                                if (dist < nearestDist) {
                                    nearestDist = dist;
                                    nearest = p;
                                }
                            }
                        });
                        if (nearest) {
                            const angle = Math.atan2(nearest.y - enemy.y, nearest.x - enemy.x);
                            const newX = enemy.x + Math.cos(angle) * enemy.speed;
                            const newY = enemy.y + Math.sin(angle) * enemy.speed;
                            if (!checkCollision(newX, newY)) {
                                enemy.x = newX;
                                enemy.y = newY;
                            }
                        }
                        break;
                        
                    case 'patrol':
                        if (enemy.path.length > 1) {
                            const target = enemy.path[enemy.pathIndex];
                            const angle = Math.atan2(target.y - enemy.y, target.x - enemy.x);
                            enemy.x += Math.cos(angle) * enemy.speed;
                            enemy.y += Math.sin(angle) * enemy.speed;
                            
                            if (Math.hypot(target.x - enemy.x, target.y - enemy.y) < 5) {
                                enemy.pathIndex = (enemy.pathIndex + 1) % enemy.path.length;
                            }
                        }
                        break;
                        
                    case 'random':
                        enemy.randomTimer++;
                        if (enemy.randomTimer > 60) {
                            enemy.randomTimer = 0;
                            enemy.angle = Math.random() * Math.PI * 2;
                        }
                        const newX = enemy.x + Math.cos(enemy.angle) * enemy.speed;
                        const newY = enemy.y + Math.sin(enemy.angle) * enemy.speed;
                        if (!checkCollision(newX, newY)) {
                            enemy.x = newX;
                            enemy.y = newY;
                        } else {
                            enemy.angle = Math.random() * Math.PI * 2;
                        }
                        break;
                        
                    case 'spinner':
                        enemy.angle += 0.05;
                        const radius = 50;
                        const centerX = enemy.path[0] ? enemy.path[0].x : enemy.x;
                        const centerY = enemy.path[0] ? enemy.path[0].y : enemy.y;
                        enemy.x = centerX + Math.cos(enemy.angle) * radius;
                        enemy.y = centerY + Math.sin(enemy.angle) * radius;
                        break;
                        
                    case 'teleporter':
                        enemy.teleportTimer++;
                        if (enemy.teleportTimer > 120) {
                            enemy.teleportTimer = 0;
                            // Teleport to random open spot
                            let attempts = 0;
                            while (attempts < 50) {
                                const rx = Math.floor(Math.random() * currentMap[0].length);
                                const ry = Math.floor(Math.random() * currentMap.length);
                                if (currentMap[ry][rx] === 0) {
                                    enemy.x = rx * TILE_SIZE + TILE_SIZE/2;
                                    enemy.y = ry * TILE_SIZE + TILE_SIZE/2;
                                    break;
                                }
                                attempts++;
                            }
                        }
                        break;
                }
                
                // Check collision with players
                Object.entries(playerData).forEach(([pid, player]) => {
                    if (!player.dead) {
                        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                        if (dist < ENEMY_SIZE) {
                            update(ref(database, `colorquest/${roomCode}/players/${pid}`), {
                                dead: true
                            });
                        }
                    }
                });
            });
        }

        function checkTreasures() {
            if (!playerData[pcID] || playerData[pcID].dead) return;
            
            const myPlayer = playerData[pcID];
            treasures.forEach(treasure => {
                if (!treasure.collected) {
                    const dist = Math.hypot(myPlayer.x - treasure.x, myPlayer.y - treasure.y);
                    if (dist < TREASURE_SIZE + PLAYER_SIZE/2) {
                        // Collect treasure
                        update(ref(database, `colorquest/${roomCode}/treasures/${treasure.id}`), true);
                        update(ref(database, `colorquest/${roomCode}`), {
                            collectedTreasure: collectedTreasure + 1
                        });
                    }
                }
            });
        }

        function checkRevives() {
            if (!playerData[pcID] || playerData[pcID].dead) return;
            
            const myPlayer = playerData[pcID];
            Object.entries(playerData).forEach(([pid, player]) => {
                if (pid !== pcID && player.dead) {
                    const dist = Math.hypot(myPlayer.x - player.x, myPlayer.y - player.y);
                    if (dist < PLAYER_SIZE * 1.5) {
                        update(ref(database, `colorquest/${roomCode}/players/${pid}`), {
                            dead: false
                        });
                    }
                }
            });
        }

        // Rendering
        function render() {
            // Clear main canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Calculate camera position
            const myPlayer = playerData[pcID];
            let cameraX = 0;
            let cameraY = 0;
            
            if (myPlayer) {
                cameraX = myPlayer.x - canvas.width / 2;
                cameraY = myPlayer.y - canvas.height / 2;
                
                // Clamp camera to map bounds
                cameraX = Math.max(0, Math.min(cameraX, currentMap[0].length * TILE_SIZE - canvas.width));
                cameraY = Math.max(0, Math.min(cameraY, currentMap.length * TILE_SIZE - canvas.height));
            }
            
            ctx.save();
            ctx.translate(-cameraX, -cameraY);
            
            // Draw map
            for (let y = 0; y < currentMap.length; y++) {
                for (let x = 0; x < currentMap[y].length; x++) {
                    if (currentMap[y][x] === 1) {
                        ctx.fillStyle = '#2a2a4a';
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#1a1a3a';
                        ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
            
            // Draw start zone
            ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.fillRect(startPos.x * TILE_SIZE, startPos.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.strokeRect(startPos.x * TILE_SIZE, startPos.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            
            // Draw treasures
            treasures.forEach(treasure => {
                if (!treasure.collected) {
                    ctx.save();
                    ctx.translate(treasure.x, treasure.y);
                    ctx.rotate(Date.now() / 500);
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(-TREASURE_SIZE/2, -TREASURE_SIZE/2, TREASURE_SIZE, TREASURE_SIZE);
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-TREASURE_SIZE/2, -TREASURE_SIZE/2, TREASURE_SIZE, TREASURE_SIZE);
                    ctx.restore();
                }
            });
            
            // Draw enemies
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.type === 'chaser' ? '#ff0000' :
                               enemy.type === 'patrol' ? '#ff8800' :
                               enemy.type === 'random' ? '#ff00ff' :
                               enemy.type === 'spinner' ? '#00ffff' :
                               '#8800ff';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, ENEMY_SIZE/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw enemy type indicator
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const icon = enemy.type === 'chaser' ? '👁' :
                            enemy.type === 'patrol' ? '↔' :
                            enemy.type === 'random' ? '?' :
                            enemy.type === 'spinner' ? '🌀' : '⚡';
                ctx.fillText(icon, enemy.x, enemy.y);
            });
            
            // Draw players
            Object.values(playerData).forEach(player => {
                if (player.dead) {
                    ctx.globalAlpha = 0.3;
                }
                
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(player.x, player.y, PLAYER_SIZE/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                if (player.dead) {
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💀', player.x, player.y);
                }
                
                ctx.globalAlpha = 1;
                
                // Draw name
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(player.name, player.x, player.y - PLAYER_SIZE);
                ctx.fillText(player.name, player.x, player.y - PLAYER_SIZE);
            });
            
            ctx.restore();
            
            // Draw minimap
            renderMinimap();
        }

        function renderMinimap() {
            miniCtx.fillStyle = '#000';
            miniCtx.fillRect(0, 0, miniMap.width, miniMap.height);
            
            const scaleX = miniMap.width / (currentMap[0].length * TILE_SIZE);
            const scaleY = miniMap.height / (currentMap.length * TILE_SIZE);
            
            // Draw map
            for (let y = 0; y < currentMap.length; y++) {
                for (let x = 0; x < currentMap[y].length; x++) {
                    if (currentMap[y][x] === 1) {
                        miniCtx.fillStyle = '#444';
                        miniCtx.fillRect(
                            x * TILE_SIZE * scaleX,
                            y * TILE_SIZE * scaleY,
                            TILE_SIZE * scaleX,
                            TILE_SIZE * scaleY
                        );
                    }
                }
            }
            
            // Draw start
            miniCtx.fillStyle = '#00ff00';
            miniCtx.fillRect(
                startPos.x * TILE_SIZE * scaleX,
                startPos.y * TILE_SIZE * scaleY,
                TILE_SIZE * scaleX,
                TILE_SIZE * scaleY
            );
            
            // Draw treasures
            treasures.forEach(treasure => {
                if (!treasure.collected) {
                    miniCtx.fillStyle = '#ffd700';
                    miniCtx.fillRect(
                        treasure.x * scaleX - 2,
                        treasure.y * scaleY - 2,
                        4, 4
                    );
                }
            });
            
            // Draw enemies
            enemies.forEach(enemy => {
                miniCtx.fillStyle = '#ff0000';
                miniCtx.beginPath();
                miniCtx.arc(
                    enemy.x * scaleX,
                    enemy.y * scaleY,
                    3, 0, Math.PI * 2
                );
                miniCtx.fill();
            });
            
            // Draw players
            Object.values(playerData).forEach(player => {
                miniCtx.fillStyle = player.dead ? '#666' : player.color;
                miniCtx.beginPath();
                miniCtx.arc(
                    player.x * scaleX,
                    player.y * scaleY,
                    4, 0, Math.PI * 2
                );
                miniCtx.fill();
            });
        }
    </script>
