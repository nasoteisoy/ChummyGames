<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt - Multiplayer Co-op</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameContainer {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #gameCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            border: 3px solid #16213e;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
        }

        #minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4CAF50;
            border-radius: 5px;
            z-index: 10;
        }

        #joystickContainer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            z-index: 100;
        }

        #joystickOuter {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
        }

        #joystickInner {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            border: 3px solid white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #colorButtons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .colorBtn {
            width: 50px;
            height: 50px;
            border: 3px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .colorBtn:active {
            transform: scale(0.9);
        }

        .colorBtn.selected {
            border: 4px solid gold;
            box-shadow: 0 0 20px gold;
        }

        #nameButton {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #nameButton:active {
            transform: translateX(-50%) scale(0.95);
        }

        #setupScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .setupCard {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .setupCard h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .setupCard p {
            color: #666;
            margin-bottom: 30px;
        }

        .setupCard input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }

        .setupCard button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .setupCard button:hover {
            background: #45a049;
        }

        .setupCard button:active {
            transform: scale(0.98);
        }

        #statusMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 24px;
            z-index: 2000;
            display: none;
            text-align: center;
        }

        .gameOver {
            background: rgba(255, 0, 0, 0.9) !important;
        }

        .levelComplete {
            background: rgba(76, 175, 80, 0.9) !important;
        }

        .revivePrompt {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 100, 100, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 150;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="setupScreen">
        <div class="setupCard">
            <h1>🏴‍☠️ Treasure Hunt</h1>
            <p>Enter a 4-character room code to join or create a game</p>
            <input type="text" id="roomCodeInput" maxlength="4" placeholder="ABCD" />
            <button id="joinButton">Join Game</button>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <canvas id="minimap"></canvas>
        
        <div id="ui">
            <div>Level: <span id="levelNum">1</span></div>
            <div>Treasures: <span id="treasureCount">0</span>/<span id="treasureGoal">5</span></div>
            <div>Room: <span id="roomCode">----</span></div>
        </div>

        <button id="nameButton">Change Name</button>

        <div id="joystickContainer">
            <div id="joystickOuter">
                <div id="joystickInner"></div>
            </div>
        </div>

        <div id="colorButtons"></div>

        <div id="revivePrompt">Touch teammate to revive!</div>
    </div>

    <div id="statusMessage"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, remove, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDVbt_8GuRuHJRPAN7jFXbs_lJUfUHNxHE",
            authDomain: "chummy-games.firebaseapp.com",
            databaseURL: "https://chummy-games-default-rtdb.firebaseio.com",
            projectId: "chummy-games",
            storageBucket: "chummy-games.firebasestorage.app",
            messagingSenderId: "869241598273",
            appId: "1:869241598273:web:d97492b7308f785c37f1c0"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Utility functions
        function getOrCreatePCID() {
            const storageKey = 'ChummyGames-PC-ID';
            let pcID = localStorage.getItem(storageKey);
            if (!pcID || pcID.length !== 12) {
                pcID = generateCode(12);
                localStorage.setItem(storageKey, pcID);
            }
            return pcID;
        }

        function generateCode(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            return Array.from({ length }, () => 
                chars[Math.floor(Math.random() * chars.length)]
            ).join('');
        }

        // Game constants
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const PLAYER_SIZE = 20;
        const TREASURE_SIZE = 15;
        const ENEMY_SIZE = 18;
        const ROOM_SIZE = 400;
        const COLORS = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F'];

        // Game state
        let gameState = {
            players: {},
            treasures: {},
            enemies: {},
            level: 1,
            roomCode: '',
            playerID: getOrCreatePCID(),
            joystick: { x: 0, y: 0, active: false },
            camera: { x: 0, y: 0 },
            deadPlayers: new Set()
        };

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimap = document.getElementById('minimap');
        const minimapCtx = minimap.getContext('2d');
        
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Level definitions
        const LEVELS = [
            {
                rooms: generateRooms(3, 3),
                treasureCount: 5,
                enemyCount: 3,
                enemyTypes: ['chaser', 'patroller']
            },
            {
                rooms: generateRooms(4, 3),
                treasureCount: 7,
                enemyCount: 5,
                enemyTypes: ['chaser', 'patroller', 'shooter']
            },
            {
                rooms: generateRooms(4, 4),
                treasureCount: 9,
                enemyCount: 8,
                enemyTypes: ['chaser', 'patroller', 'shooter', 'teleporter']
            },
            {
                rooms: generateRooms(5, 4),
                treasureCount: 12,
                enemyCount: 12,
                enemyTypes: ['chaser', 'patroller', 'shooter', 'teleporter', 'splitter']
            },
            {
                rooms: generateRooms(5, 5),
                treasureCount: 15,
                enemyCount: 15,
                enemyTypes: ['chaser', 'patroller', 'shooter', 'teleporter', 'splitter']
            }
        ];

        function generateRooms(cols, rows) {
            const rooms = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    rooms.push({
                        x: x * ROOM_SIZE,
                        y: y * ROOM_SIZE,
                        connections: {
                            right: x < cols - 1,
                            down: y < rows - 1,
                            left: x > 0,
                            up: y > 0
                        }
                    });
                }
            }
            return rooms;
        }

        // Setup screen handlers
        document.getElementById('joinButton').addEventListener('click', () => {
            const roomCode = document.getElementById('roomCodeInput').value.toUpperCase();
            if (roomCode.length === 4) {
                gameState.roomCode = roomCode;
                document.getElementById('setupScreen').style.display = 'none';
                document.getElementById('gameContainer').style.display = 'block';
                document.getElementById('roomCode').textContent = roomCode;
                initializeGame();
            } else {
                alert('Please enter a 4-character room code');
            }
        });

        // Name change handler
        document.getElementById('nameButton').addEventListener('click', () => {
            const newName = prompt('Enter your name:', gameState.players[gameState.playerID]?.name || 'Player');
            if (newName && newName.trim()) {
                updatePlayer({ name: newName.trim() });
            }
        });

        // Initialize game
        function initializeGame() {
            setupColorButtons();
            setupJoystick();
            
            const playerRef = ref(database, `treasureHunt/${gameState.roomCode}/players/${gameState.playerID}`);
            const levelRef = ref(database, `treasureHunt/${gameState.roomCode}/level`);
            const treasuresRef = ref(database, `treasureHunt/${gameState.roomCode}/treasures`);
            const enemiesRef = ref(database, `treasureHunt/${gameState.roomCode}/enemies`);

            // Set up disconnect handler
            onDisconnect(playerRef).remove();

            // Initialize player
            const playerNum = Object.keys(gameState.players).length + 1;
            set(playerRef, {
                x: 50,
                y: 50,
                color: COLORS[0],
                name: `Player${playerNum}`,
                treasuresCollected: 0,
                alive: true,
                timestamp: Date.now()
            });

            // Listen for player updates
            onValue(ref(database, `treasureHunt/${gameState.roomCode}/players`), (snapshot) => {
                gameState.players = snapshot.val() || {};
            });

            // Listen for level updates
            onValue(levelRef, (snapshot) => {
                const level = snapshot.val() || 1;
                if (level !== gameState.level) {
                    gameState.level = level;
                    document.getElementById('levelNum').textContent = level;
                    if (gameState.playerID === getHostPlayer()) {
                        initializeLevel(level);
                    }
                }
            });

            // Listen for treasure updates
            onValue(treasuresRef, (snapshot) => {
                gameState.treasures = snapshot.val() || {};
                updateTreasureUI();
            });

            // Listen for enemy updates
            onValue(enemiesRef, (snapshot) => {
                gameState.enemies = snapshot.val() || {};
            });

            // Initialize level if host
            if (Object.keys(gameState.players).length === 0) {
                set(levelRef, 1);
                initializeLevel(1);
            }

            // Start game loop
            gameLoop();
        }

        function getHostPlayer() {
            const players = Object.keys(gameState.players);
            return players.sort()[0];
        }

        function initializeLevel(level) {
            const levelData = LEVELS[level - 1];
            const treasuresRef = ref(database, `treasureHunt/${gameState.roomCode}/treasures`);
            const enemiesRef = ref(database, `treasureHunt/${gameState.roomCode}/enemies`);

            // Generate treasures
            const treasures = {};
            for (let i = 0; i < levelData.treasureCount; i++) {
                const room = levelData.rooms[Math.floor(Math.random() * levelData.rooms.length)];
                treasures[`treasure${i}`] = {
                    x: room.x + Math.random() * (ROOM_SIZE - 50) + 25,
                    y: room.y + Math.random() * (ROOM_SIZE - 50) + 25,
                    collected: false
                };
            }
            set(treasuresRef, treasures);

            // Generate enemies
            const enemies = {};
            for (let i = 0; i < levelData.enemyCount; i++) {
                const room = levelData.rooms[Math.floor(Math.random() * levelData.rooms.length)];
                const type = levelData.enemyTypes[Math.floor(Math.random() * levelData.enemyTypes.length)];
                enemies[`enemy${i}`] = {
                    x: room.x + Math.random() * (ROOM_SIZE - 100) + 50,
                    y: room.y + Math.random() * (ROOM_SIZE - 100) + 50,
                    type: type,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    timestamp: Date.now()
                };
            }
            set(enemiesRef, enemies);

            // Reset all players
            Object.keys(gameState.players).forEach(pid => {
                update(ref(database, `treasureHunt/${gameState.roomCode}/players/${pid}`), {
                    x: 50,
                    y: 50,
                    treasuresCollected: 0,
                    alive: true
                });
            });

            gameState.deadPlayers.clear();
            document.getElementById('treasureGoal').textContent = levelData.treasureCount;
            showMessage(`Level ${level} Start!`, 'levelComplete', 2000);
        }

        function setupColorButtons() {
            const container = document.getElementById('colorButtons');
            COLORS.forEach((color, index) => {
                const btn = document.createElement('div');
                btn.className = 'colorBtn';
                btn.style.background = color;
                if (index === 0) btn.classList.add('selected');
                btn.addEventListener('click', () => selectColor(color, btn));
                container.appendChild(btn);
            });
        }

        function selectColor(color, btn) {
            // Check if color is already taken
            const colorTaken = Object.entries(gameState.players).some(([pid, player]) => 
                pid !== gameState.playerID && player.color === color
            );

            if (colorTaken) {
                showMessage('Color already taken!', 'gameOver', 1000);
                return;
            }

            document.querySelectorAll('.colorBtn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            updatePlayer({ color });
        }

        function setupJoystick() {
            const outer = document.getElementById('joystickOuter');
            const inner = document.getElementById('joystickInner');
            let rect;

            function handleStart(e) {
                e.preventDefault();
                rect = outer.getBoundingClientRect();
                gameState.joystick.active = true;
                handleMove(e);
            }

            function handleMove(e) {
                if (!gameState.joystick.active) return;
                e.preventDefault();

                const touch = e.touches ? e.touches[0] : e;
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let deltaX = touch.clientX - centerX;
                let deltaY = touch.clientY - centerY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                const maxDistance = rect.width / 2 - 30;

                if (distance > maxDistance) {
                    deltaX = (deltaX / distance) * maxDistance;
                    deltaY = (deltaY / distance) * maxDistance;
                }

                inner.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
                
                gameState.joystick.x = deltaX / maxDistance;
                gameState.joystick.y = deltaY / maxDistance;
            }

            function handleEnd(e) {
                e.preventDefault();
                gameState.joystick.active = false;
                gameState.joystick.x = 0;
                gameState.joystick.y = 0;
                inner.style.transform = 'translate(-50%, -50%)';
            }

            outer.addEventListener('touchstart', handleStart);
            outer.addEventListener('touchmove', handleMove);
            outer.addEventListener('touchend', handleEnd);
            outer.addEventListener('mousedown', handleStart);
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleEnd);
        }

        function updatePlayer(data) {
            const playerRef = ref(database, `treasureHunt/${gameState.roomCode}/players/${gameState.playerID}`);
            update(playerRef, { ...data, timestamp: Date.now() });
        }

        function updateTreasureUI() {
            const collected = Object.values(gameState.treasures).filter(t => t.collected).length;
            const total = Object.keys(gameState.treasures).length;
            document.getElementById('treasureCount').textContent = collected;
            
            // Check if all treasures collected
            if (collected === total && total > 0) {
                checkLevelComplete();
            }
        }

        function checkLevelComplete() {
            const myPlayer = gameState.players[gameState.playerID];
            if (!myPlayer) return;

            // Check if player is back at start
            if (Math.abs(myPlayer.x - 50) < 30 && Math.abs(myPlayer.y - 50) < 30) {
                // Check if all players are at start
                const allAtStart = Object.values(gameState.players).every(p => 
                    Math.abs(p.x - 50) < 50 && Math.abs(p.y - 50) < 50
                );

                if (allAtStart && gameState.playerID === getHostPlayer()) {
                    if (gameState.level < 5) {
                        set(ref(database, `treasureHunt/${gameState.roomCode}/level`), gameState.level + 1);
                    } else {
                        showMessage('🎉 GAME COMPLETE! 🎉', 'levelComplete', 5000);
                    }
                }
            }
        }

        // Game loop
        function gameLoop() {
            updateGame();
            renderGame();
            renderMinimap();
            requestAnimationFrame(gameLoop);
        }

        function updateGame() {
            const myPlayer = gameState.players[gameState.playerID];
            if (!myPlayer || !myPlayer.alive) {
                document.getElementById('revivePrompt').style.display = myPlayer && !myPlayer.alive ? 'block' : 'none';
                return;
            }

            document.getElementById('revivePrompt').style.display = 'none';

            // Move player
            const speed = 3;
            const newX = myPlayer.x + gameState.joystick.x * speed;
            const newY = myPlayer.y + gameState.joystick.y * speed;

            const levelData = LEVELS[gameState.level - 1];
            const maxX = Math.max(...levelData.rooms.map(r => r.x)) + ROOM_SIZE;
            const maxY = Math.max(...levelData.rooms.map(r => r.y)) + ROOM_SIZE;

            // Boundary check
            if (newX >= 0 && newX <= maxX - PLAYER_SIZE && newY >= 0 && newY <= maxY - PLAYER_SIZE) {
                updatePlayer({ x: newX, y: newY });
            }

            // Update camera
            gameState.camera.x = myPlayer.x - CANVAS_WIDTH / 2;
            gameState.camera.y = myPlayer.y - CANVAS_HEIGHT / 2;

            // Collect treasures
            Object.entries(gameState.treasures).forEach(([tid, treasure]) => {
                if (!treasure.collected) {
                    const dx = myPlayer.x - treasure.x;
                    const dy = myPlayer.y - treasure.y;
                    if (Math.sqrt(dx * dx + dy * dy) < PLAYER_SIZE + TREASURE_SIZE) {
                        update(ref(database, `treasureHunt/${gameState.roomCode}/treasures/${tid}`), { 
                            collected: true 
                        });
                        updatePlayer({ treasuresCollected: (myPlayer.treasuresCollected || 0) + 1 });
                    }
                }
            });

            // Check revive collision
            Object.entries(gameState.players).forEach(([pid, player]) => {
                if (pid !== gameState.playerID && !player.alive) {
                    const dx = myPlayer.x - player.x;
                    const dy = myPlayer.y - player.y;
                    if (Math.sqrt(dx * dx + dy * dy) < PLAYER_SIZE * 2) {
                        update(ref(database, `treasureHunt/${gameState.roomCode}/players/${pid}`), { 
                            alive: true 
                        });
                        gameState.deadPlayers.delete(pid);
                        showMessage('Teammate revived!', 'levelComplete', 1000);
                    }
                }
            });

            // Update enemies (host only)
            if (gameState.playerID === getHostPlayer()) {
                updateEnemies();
            }

            // Check enemy collisions
            Object.entries(gameState.enemies).forEach(([eid, enemy]) => {
                const dx = myPlayer.x - enemy.x;
                const dy = myPlayer.y - enemy.y;
                if (Math.sqrt(dx * dx + dy * dy) < PLAYER_SIZE + ENEMY_SIZE) {
                    updatePlayer({ alive: false });
                    gameState.deadPlayers.add(gameState.playerID);
                    checkGameOver();
                }
            });
        }

        function updateEnemies() {
            const levelData = LEVELS[gameState.level - 1];
            const maxX = Math.max(...levelData.rooms.map(r => r.x)) + ROOM_SIZE;
            const maxY = Math.max(...levelData.rooms.map(r => r.y)) + ROOM_SIZE;

            Object.entries(gameState.enemies).forEach(([eid, enemy]) => {
                let newX = enemy.x;
                let newY = enemy.y;
                let newVx = enemy.vx;
                let newVy = enemy.vy;

                switch(enemy.type) {
                    case 'chaser':
                        // Chase nearest alive player
                        const nearestPlayer = findNearestAlivePlayer(enemy);
                        if (nearestPlayer) {
                            const dx = nearestPlayer.x - enemy.x;
                            const dy = nearestPlayer.y - enemy.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            newVx = (dx / dist) * 1.5;
                            newVy = (dy / dist) * 1.5;
                        }
                        break;

                    case 'patroller':
                        // Bounce off walls
                        if (enemy.x <= 0 || enemy.x >= maxX - ENEMY_SIZE) newVx *= -1;
                        if (enemy.y <= 0 || enemy.y >= maxY - ENEMY_SIZE) newVy *= -1;
                        break;

                    case 'shooter':
                        // Stay still and shoot (simplified)
                        newVx = 0;
                        newVy = 0;
                        break;

                    case 'teleporter':
                        // Teleport randomly every 3 seconds
                        if (Date.now() - enemy.timestamp > 3000) {
                            const room = levelData.rooms[Math.floor(Math.random() * levelData.rooms.length)];
                            newX = room.x + Math.random() * (ROOM_SIZE - 100) + 50;
                            newY = room.y + Math.random() * (ROOM_SIZE - 100) + 50;
                            update(ref(database, `treasureHunt/${gameState.roomCode}/enemies/${eid}`), { 
                                timestamp: Date.now() 
                            });
                        }
                        break;

                    case 'splitter':
                        // Move in zigzag
                        if (Math.random() < 0.02) {
                            newVx = (Math.random() - 0.5) * 3;
                            newVy = (Math.random() - 0.5) * 3;
                        }
                        break;
                }

                newX = enemy.x + newVx;
                newY = enemy.y + newVy;

                // Boundary check
                newX = Math.max(0, Math.min(maxX - ENEMY_SIZE, newX));
                newY = Math.max(0, Math.min(maxY - ENEMY_SIZE, newY));

                update(ref(database, `treasureHunt/${gameState.roomCode}/enemies/${eid}`), {
                    x: newX,
                    y: newY,
                    vx: newVx,
                    vy: newVy
                });
            });
        }

        function findNearestAlivePlayer(enemy) {
            let nearest = null;
            let minDist = Infinity;

            Object.values(gameState.players).forEach(player => {
                if (player.alive) {
                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = player;
                    }
                }
            });

            return nearest;
        }

        function checkGameOver() {
            const allDead = Object.values(gameState.players).every(p => !p.alive);
            if (allDead && gameState.playerID === getHostPlayer()) {
                showMessage('💀 ALL PLAYERS DEAD! Restarting level...', 'gameOver', 3000);
                setTimeout(() => {
                    initializeLevel(gameState.level);
                }, 3000);
            }
        }

        function renderGame() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const levelData = LEVELS[gameState.level - 1];

            // Draw rooms
            ctx.save();
            ctx.translate(-gameState.camera.x, -gameState.camera.y);

            levelData.rooms.forEach(room => {
                // Room background
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(room.x, room.y, ROOM_SIZE, ROOM_SIZE);

                // Room border
                ctx.strokeStyle = '#16213e';
                ctx.lineWidth = 3;
                ctx.strokeRect(room.x, room.y, ROOM_SIZE, ROOM_SIZE);

                // Doorways
                ctx.fillStyle = '#2a2a4e';
                if (room.connections.right) {
                    ctx.fillRect(room.x + ROOM_SIZE - 5, room.y + ROOM_SIZE / 2 - 30, 10, 60);
                }
                if (room.connections.down) {
                    ctx.fillRect(room.x + ROOM_SIZE / 2 - 30, room.y + ROOM_SIZE - 5, 60, 10);
                }
            });

            // Draw start zone
            ctx.fillStyle = 'rgba(76, 175, 80, 0.3)';
            ctx.beginPath();
            ctx.arc(50, 50, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw treasures
            Object.values(gameState.treasures).forEach(treasure => {
                if (!treasure.collected) {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(treasure.x, treasure.y, TREASURE_SIZE, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Sparkle
                    ctx.fillStyle = '#FFED4E';
                    ctx.beginPath();
                    ctx.arc(treasure.x - 5, treasure.y - 5, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw enemies
            Object.values(gameState.enemies).forEach(enemy => {
                const colors = {
                    chaser: '#FF3333',
                    patroller: '#FF9933',
                    shooter: '#9933FF',
                    teleporter: '#33FFFF',
                    splitter: '#FF33FF'
                };

                ctx.fillStyle = colors[enemy.type];
                
                // Different shapes for different types
                switch(enemy.type) {
                    case 'chaser':
                        // Triangle
                        ctx.beginPath();
                        ctx.moveTo(enemy.x, enemy.y - ENEMY_SIZE);
                        ctx.lineTo(enemy.x - ENEMY_SIZE, enemy.y + ENEMY_SIZE);
                        ctx.lineTo(enemy.x + ENEMY_SIZE, enemy.y + ENEMY_SIZE);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'shooter':
                        // Square
                        ctx.fillRect(enemy.x - ENEMY_SIZE, enemy.y - ENEMY_SIZE, ENEMY_SIZE * 2, ENEMY_SIZE * 2);
                        break;
                    case 'teleporter':
                        // Diamond
                        ctx.beginPath();
                        ctx.moveTo(enemy.x, enemy.y - ENEMY_SIZE);
                        ctx.lineTo(enemy.x + ENEMY_SIZE, enemy.y);
                        ctx.lineTo(enemy.x, enemy.y + ENEMY_SIZE);
                        ctx.lineTo(enemy.x - ENEMY_SIZE, enemy.y);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    case 'splitter':
                        // Star
                        drawStar(ctx, enemy.x, enemy.y, 5, ENEMY_SIZE, ENEMY_SIZE / 2);
                        break;
                    default:
                        // Circle
                        ctx.beginPath();
                        ctx.arc(enemy.x, enemy.y, ENEMY_SIZE, 0, Math.PI * 2);
                        ctx.fill();
                }

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw players
            Object.entries(gameState.players).forEach(([pid, player]) => {
                if (player.alive) {
                    // Player circle
                    ctx.fillStyle = player.color;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, PLAYER_SIZE, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Name
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(player.name, player.x, player.y - PLAYER_SIZE - 5);
                } else {
                    // Dead player (ghost)
                    ctx.fillStyle = 'rgba(150, 150, 150, 0.5)';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, PLAYER_SIZE, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('💀', player.x, player.y + 7);
                }
            });

            ctx.restore();
        }

        function drawStar(ctx, x, y, points, outerRadius, innerRadius) {
            ctx.beginPath();
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / points - Math.PI / 2;
                const px = x + radius * Math.cos(angle);
                const py = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
        }

        function renderMinimap() {
            const mmCtx = minimapCtx;
            mmCtx.fillStyle = '#000';
            mmCtx.fillRect(0, 0, 200, 200);

            const levelData = LEVELS[gameState.level - 1];
            const maxX = Math.max(...levelData.rooms.map(r => r.x)) + ROOM_SIZE;
            const maxY = Math.max(...levelData.rooms.map(r => r.y)) + ROOM_SIZE;
            const scale = Math.min(180 / maxX, 180 / maxY);

            // Draw rooms
            levelData.rooms.forEach(room => {
                mmCtx.fillStyle = '#2a2a4e';
                mmCtx.fillRect(10 + room.x * scale, 10 + room.y * scale, ROOM_SIZE * scale, ROOM_SIZE * scale);
            });

            // Draw start
            mmCtx.fillStyle = '#4CAF50';
            mmCtx.fillRect(10, 10, 10, 10);

            // Draw treasures
            Object.values(gameState.treasures).forEach(treasure => {
                if (!treasure.collected) {
                    mmCtx.fillStyle = '#FFD700';
                    mmCtx.fillRect(8 + treasure.x * scale, 8 + treasure.y * scale, 4, 4);
                }
            });

            // Draw enemies
            Object.values(gameState.enemies).forEach(enemy => {
                mmCtx.fillStyle = '#FF0000';
                mmCtx.fillRect(8 + enemy.x * scale, 8 + enemy.y * scale, 4, 4);
            });

            // Draw players
            Object.entries(gameState.players).forEach(([pid, player]) => {
                mmCtx.fillStyle = player.alive ? player.color : '#888';
                mmCtx.fillRect(8 + player.x * scale, 8 + player.y * scale, 4, 4);
            });
        }

        function showMessage(text, className, duration) {
            const msg = document.getElementById('statusMessage');
            msg.textContent = text;
            msg.className = className;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, duration);
        }
    </script>
