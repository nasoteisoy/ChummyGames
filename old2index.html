<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Showdown Deez Elements</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#fff;
    font-family:'Press Start 2P',monospace;touch-action:none;user-select:none;
    -webkit-user-select:none;-webkit-touch-callout:none}
  .screen{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;
    z-index:10;padding:16px;overflow-y:auto}
  .screen.active{display:flex}
  .scr-title{font-size:clamp(13px,3.5vw,24px);text-align:center;line-height:1.8;
    text-shadow:0 0 20px rgba(255,100,0,.6),0 2px 0 #000;margin-bottom:20px;
    animation:tp 3s ease-in-out infinite}
  .scr-title .sub{font-size:clamp(9px,2.2vw,14px);color:#b08040}
  @keyframes tp{0%,100%{text-shadow:0 0 20px rgba(255,100,0,.6),0 2px 0 #000}
    50%{text-shadow:0 0 40px rgba(255,100,0,.9),0 0 80px rgba(255,60,0,.3),0 2px 0 #000}}
  #loginScreen,#menuScreen{background:linear-gradient(180deg,#1a0800 0%,#2d1200 40%,#0a0a0a 100%)}
  #loginScreen::before,#menuScreen::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 30%,rgba(255,100,0,.12)0%,transparent 60%);pointer-events:none}
  .btn{font-family:'Press Start 2P',monospace;font-size:clamp(8px,2vw,12px);
    padding:10px 18px;margin:5px;border:3px solid;cursor:pointer;background:transparent;
    color:#fff;transition:all .15s;min-width:160px;text-align:center;position:relative}
  .btn:active{transform:scale(.95)}
  .btn-fire{border-color:#ff4400}.btn-earth{border-color:#8B7355}
  .btn-water{border-color:#2288dd}.btn-air{border-color:#88bb88}
  .btn-go{border-color:#44cc44;color:#44cc44}
  .btn-back{border-color:#555;font-size:8px;padding:8px 14px;min-width:auto}
  .btn-danger{border-color:#cc2222;color:#cc2222}
  .btn-vip{border-color:#ff8800;color:#ff8800}
  .btn-sm{font-size:7px;padding:6px 10px;min-width:auto;margin:3px}
  .text-input{font-family:'Press Start 2P',monospace;font-size:clamp(12px,3vw,18px);
    text-align:center;background:transparent;border:none;border-bottom:3px solid #8B7355;
    color:#fff;width:220px;padding:10px;outline:none}
  .text-input::placeholder{color:#333;font-size:clamp(8px,2vw,12px)}
  .status-text{font-size:clamp(7px,1.8vw,10px);color:#888;margin:6px 0;text-align:center;line-height:1.8}
  .error-text{color:#ff4444;font-size:8px;margin:6px 0;min-height:12px}
  .room-list{width:100%;max-width:400px;margin:8px 0;max-height:50vh;overflow-y:auto}
  .room-card{display:flex;align-items:center;gap:6px;padding:10px;border:2px solid #222;
    margin:4px 0;border-radius:4px;cursor:pointer;transition:border-color .15s;flex-wrap:wrap}
  .room-card:active{border-color:#ff8800}
  .room-card .rc-name{font-size:9px;flex:1;min-width:80px;color:#ddd}
  .room-card .rc-info{font-size:7px;color:#888}
  .room-card .rc-status{font-size:7px;padding:3px 6px;border-radius:3px;border:1px solid}
  .rc-status.lobby{color:#44cc44;border-color:#44cc44}
  .rc-status.playing{color:#ff8800;border-color:#ff8800}
  .rc-status.paused{color:#ff4444;border-color:#ff4444}
  .my-room{border-color:#444}
  .lobby-box{width:100%;max-width:360px;margin:8px 0}
  .lobby-slot{display:flex;align-items:center;gap:6px;padding:8px;
    border:2px solid #222;margin:4px 0;border-radius:4px;flex-wrap:wrap}
  .lobby-slot.me{border-color:#444}
  .slot-label{font-size:8px;color:#aaa;min-width:36px}
  .slot-label.vip{color:#ff8800}
  .lobby-picks{display:flex;gap:3px;flex-wrap:wrap}
  .pick-btn{width:34px;height:34px;border:2px solid #444;border-radius:4px;
    background:transparent;font-size:15px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:all .1s;padding:0}
  .pick-btn:active{transform:scale(.9)}
  .pick-btn.selected{border-color:#fff;background:rgba(255,255,255,.15)}
  .pick-btn.taken{opacity:.2;cursor:default}
  .pick-btn.disabled{opacity:.35;cursor:default}
  .slot-name{font-size:7px;color:#666;margin-left:auto}
  .slot-name.connected{color:#aaa}
  .slot-empty{font-size:7px;color:#333;font-style:italic}
  .vip-controls{width:100%;max-width:360px;display:flex;flex-wrap:wrap;gap:4px;
    justify-content:center;margin:8px 0}
  .copy-link{font-size:7px;color:#666;cursor:pointer;text-decoration:underline;margin:4px}
  .copy-link:active{color:#fff}
  #gameScreen{flex-direction:column;background:#0a0a0a}
  .hud{width:100%;max-width:500px;display:flex;flex-wrap:wrap;gap:3px;padding:4px 8px;justify-content:center}
  .hud-p{display:flex;align-items:center;gap:3px;flex:1;min-width:100px;max-width:180px}
  .hud-icon{font-size:11px;flex-shrink:0}
  .hud-bars{flex:1;display:flex;flex-direction:column;gap:1px}
  .hud-nm{font-size:5px;color:#aaa}
  .hp-bg{width:100%;height:9px;background:#1a1a1a;border:1px solid #333;position:relative;overflow:hidden}
  .hp-fill{height:100%;transition:width .3s;position:absolute;top:0;left:0}
  .hud-ammo{font-size:6px;color:#ff8;flex-shrink:0;min-width:20px;text-align:center}
  #canvasWrap{position:relative;width:100%;max-width:500px;aspect-ratio:320/256;
    border:3px solid #222;image-rendering:pixelated}
  #gameCanvas{width:100%;height:100%;image-rendering:pixelated;display:block}
  .controls{width:100%;max-width:500px;display:flex;justify-content:space-between;
    align-items:center;padding:8px 10px;flex-shrink:0}
  .joystick-area{width:120px;height:120px;position:relative;border-radius:50%;
    background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);flex-shrink:0}
  .joystick-knob{width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    pointer-events:none;transition:none}
  .action-btns{display:flex;flex-direction:column;gap:5px}
  .action-btn{width:68px;height:42px;border:2px solid;border-radius:8px;
    font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:transparent;color:#fff}
  .atk-btn{border-color:#ff4400;color:#ff6633}
  .atk-btn:active,.atk-btn.pressed{background:rgba(255,68,0,.3)}
  .atk-btn.cooldown{opacity:.3;border-color:#444;color:#444}
  .atk-btn.no-ammo{border-color:#662200;color:#662200}
  .grd-btn{border-color:#4488ff;color:#6699ff}
  .grd-btn:active,.grd-btn.pressed{background:rgba(68,136,255,.3)}
  .game-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:4px}
  #gameOverOverlay,#pauseOverlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.85);
    flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:10px}
  #gameOverOverlay.active,#pauseOverlay.active{display:flex}
  .overlay-title{font-size:clamp(10px,2.8vw,16px);text-align:center;line-height:2;margin-bottom:14px}
  #countdown{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
    z-index:15;pointer-events:none}
  #countdown.active{display:flex}
  #countdownText{font-size:clamp(36px,11vw,72px);color:#fff;
    text-shadow:0 0 40px rgba(255,255,255,.5),0 4px 0 #000;animation:cp .5s ease-out}
  @keyframes cp{0%{transform:scale(2);opacity:0}50%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
  .damage-flash{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;
    transition:opacity .1s;background:rgba(255,255,255,.25)}
  .damage-flash.hit{opacity:1}
  #adminScreen{background:#111;justify-content:flex-start;padding-top:40px}
  .admin-section{width:100%;max-width:500px;margin:10px 0}
  .admin-section h3{font-size:10px;color:#ff8800;margin:8px 0 4px}
  .admin-row{display:flex;align-items:center;gap:4px;padding:6px;border:1px solid #222;
    margin:2px 0;font-size:8px;flex-wrap:wrap}
  .admin-row input{font-family:'Press Start 2P',monospace;font-size:8px;background:#1a1a1a;
    border:1px solid #444;color:#fff;padding:4px 6px;width:120px}
  .admin-id{color:#666;font-size:7px;word-break:break-all}
  .tv-mode #gameScreen{justify-content:center}
  .tv-mode .controls,.tv-mode .game-btns,.tv-mode #resetBtn,.tv-mode .hud{display:flex}
  .tv-mode #canvasWrap{max-width:90vmin;border:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen">
  <div class="scr-title">SHOWDOWN<br><span class="sub">DEEZ ELEMENTS</span></div>
  <div class="status-text">ENTER YOUR NAME</div>
  <input class="text-input" id="nameInput" maxlength="10" placeholder="Name...">
  <div style="height:10px"></div>
  <button class="btn btn-go" id="nameBtn" onclick="saveName()">LET'S GO</button>
  <div class="error-text" id="nameError"></div>
</div>

<!-- MENU -->
<div id="menuScreen" class="screen">
  <div class="scr-title">SHOWDOWN<br><span class="sub">DEEZ ELEMENTS</span></div>
  <div class="status-text">Welcome, <span id="welcomeName">?</span></div>
  <button class="btn btn-go" onclick="createRoom()">+ CREATE ROOM</button>
  <div class="status-text" style="margin-top:12px">AVAILABLE ROOMS</div>
  <div class="room-list" id="roomList"><div class="status-text">Loading...</div></div>
  <div style="margin-top:10px"></div>
  <button class="btn btn-sm btn-back" onclick="changeName()">✏ CHANGE NAME</button>
</div>

<!-- LOBBY -->
<div id="lobbyScreen" class="screen">
  <div class="status-text">ROOM: <span id="lobbyRoomName">?</span></div>
  <div class="status-text" id="lobbyStatus">Pick your warrior!</div>
  <div class="lobby-box" id="slotList"></div>
  <div class="vip-controls" id="vipControls" style="display:none">
    <button class="btn btn-go" onclick="vipStartGame()">⚔ START</button>
    <button class="btn btn-danger btn-sm" onclick="vipDeleteRoom()">🗑 DELETE ROOM</button>
  </div>
  <div class="copy-link" onclick="copyTvLink()">📺 Copy TV spectator link</div>
  <div style="height:6px"></div>
  <button class="btn btn-back" onclick="leaveRoom()">← LEAVE ROOM</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <div class="hud" id="hud"></div>
  <div id="canvasWrap">
    <canvas id="gameCanvas" width="320" height="256"></canvas>
    <div id="countdown"><div id="countdownText"></div></div>
    <div id="gameOverOverlay">
      <div class="overlay-title" id="winnerText"></div>
      <div id="goVipBtns" style="display:none">
        <button class="btn btn-go btn-sm" onclick="voteReset('same')">REMATCH</button>
        <button class="btn btn-vip btn-sm" onclick="voteReset('new')">NEW PLAYERS</button>
      </div>
      <div id="goVoteBtns" style="display:none">
        <button class="btn btn-go btn-sm" onclick="voteReset('same')">⚔ REMATCH</button>
        <button class="btn btn-vip btn-sm" onclick="voteReset('new')">🔄 NEW PLAYERS</button>
      </div>
      <div class="status-text" id="voteStatus"></div>
      <button class="btn btn-back" onclick="backToLobby()">LOBBY</button>
    </div>
    <div id="pauseOverlay">
      <div class="overlay-title" id="pauseText">PAUSED<br><span class="sub" style="font-size:8px">Waiting for players...</span></div>
      <div id="pauseSlots"></div>
      <div style="height:8px"></div>
      <button class="btn btn-back" onclick="backToLobby()">LOBBY</button>
    </div>
    <div class="damage-flash" id="damageFlash"></div>
  </div>
  <div class="controls" id="controlsArea">
    <div class="joystick-area" id="joystickArea">
      <div class="joystick-knob" id="joystickKnob"></div>
    </div>
    <div class="action-btns">
      <div class="action-btn atk-btn" id="atkBtn">ATK</div>
      <div class="action-btn grd-btn" id="grdBtn">GRD</div>
    </div>
  </div>
  <div class="game-btns">
    <button class="btn btn-sm btn-back" onclick="backToLobby()">LOBBY</button>
    <button class="btn btn-sm btn-danger" id="leaveGameBtn" onclick="leaveRoom()">LEAVE</button>
    <button class="btn btn-sm btn-vip" id="resetGameBtn" style="display:none" onclick="vipResetFromGame()">↺ RESET</button>
    <span class="copy-link" onclick="copyTvLink()">📺 TV</span>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen" class="screen">
  <div class="scr-title" style="margin-top:0">🔧 ADMIN</div>
  <div class="admin-section" id="adminRooms"><h3>ROOMS</h3></div>
  <div class="admin-section" id="adminPlayers"><h3>PLAYERS</h3></div>
  <div style="height:10px"></div>
  <button class="btn btn-go btn-sm" onclick="adminCreatePcid()">+ NEW PCID</button>
  <button class="btn btn-back" onclick="location.href=location.pathname">← EXIT ADMIN</button>
</div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/player.js"></script>
<script src="js/effects.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/network.js"></script>
<script src="js/lobby.js"></script>
<script src="js/game.js"></script>
<script src="js/vip.js"></script>
<script src="js/admin.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
